[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enamad-crawler"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "opencv-python",
    "jdatetime",
    "requests",
    "ddddocr",
    "pillow",
    "pandas",
    "numpy",
    "scipy",
    "beautifulsoup4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
